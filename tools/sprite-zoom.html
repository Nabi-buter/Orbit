<!doctype html><html><head><meta charset="utf-8"><title>sprite zoom</title>
<style>body{margin:0;background:#cfcfd8}canvas{image-rendering:pixelated;display:block}</style></head><body>
<canvas id="c" width="240" height="60" style="width:1920px;height:480px"></canvas>
<script type="module">
import { WEAPONS } from '../src/config/weapons.js';
import { createFighter, S } from '../src/core/fighter.js';
import { drawFighter } from '../src/render/fighterArt.js';
import { TEAM } from '../src/render/renderer.js';
const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#d8d8e0'; ctx.fillRect(0, 0, 240, 60);
const poses = [
  ['longsword', S.IDLE, null, 1], ['greatsword', S.IDLE, null, 1], ['knuckle', S.IDLE, null, 0],
  ['longsword', S.WALK, null, 1], ['axe', S.ATTACK, 'heavy', 1], ['spear', S.DASH, null, 0],
];
poses.forEach(([w, st, atk, team], i) => {
  const f = createFighter({ id: team, x: 37 * i, facing: 1, weapon: WEAPONS[w] });
  f.state = st; if (st === S.DASH) f.dash = { dir: 1, frame: 3 };
  if (atk) f.attack = { def: WEAPONS[w][atk], frame: WEAPONS[w][atk].hits[0].to };
  drawFighter(ctx, f, 18 + i * 38, 56, { ...TEAM[team], weapon: WEAPONS[w].color }, 0);
});
</script></body></html>
