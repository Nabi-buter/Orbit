<!doctype html><html><head><meta charset="utf-8"><title>sprite zoom</title>
<style>body{margin:0;background:#cfcfd8}canvas{image-rendering:pixelated;display:block}</style></head><body>
<canvas id="c" width="240" height="60" style="width:1920px;height:480px"></canvas>
<script type="module">
import { WEAPONS } from '../src/config/weapons.js';
import { createFighter, S } from '../src/core/fighter.js';
import { drawFighter } from '../src/render/fighterArt.js';
import { TEAM } from '../src/render/renderer.js';
const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#d8d8e0'; ctx.fillRect(0, 0, 240, 60);
const poses = [
  ['longsword', S.ATTACK, 'light', 1, 'windup'], ['longsword', S.ATTACK, 'light', 1, 'hit'], ['longsword', S.GUARD, null, 0],
  ['greatsword', S.ATTACK, 'heavy', 0, 'windup'], ['greatsword', S.ATTACK, 'heavy', 0, 'hit'], ['spear', S.ATTACK, 'light', 1, 'hit'],
  ['knuckle', S.ATTACK, 'light', 0, 'hit'], ['dagger', S.HITSTUN, null, 1], ['axe', S.PARRIED, null, 0],
  ['longsword', S.GUARD_BREAK, null, 1], ['spear', S.KNOCKBACK, null, 0], ['axe', S.KO, null, 1],
];
document.getElementById('c').width = 40 * poses.length;
document.getElementById('c').style.width = 40 * poses.length * 6 + 'px';
document.getElementById('c').style.height = 60 * 6 + 'px';
ctx.fillStyle = '#d8d8e0'; ctx.fillRect(0, 0, 40 * poses.length, 60);
poses.forEach(([w, st, atk, team, ph], i) => {
  const f = createFighter({ id: team, x: 0, facing: 1, weapon: WEAPONS[w] });
  f.state = st; f.timer = 20;
  if (atk) { const d = WEAPONS[w][atk]; f.attack = { def: d, frame: ph === 'windup' ? d.hits[0].from - 2 : d.hits[0].to }; }
  drawFighter(ctx, f, 20 + i * 40, 56, { ...TEAM[team], weapon: WEAPONS[w].color }, 0, { smooth: false });
});
</script></body></html>
